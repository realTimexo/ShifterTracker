name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build self-contained Windows release
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          files: |
            artifacts/ShiftTracker-v*-win-x64.exe
            artifacts/ShiftTracker-v*-win-x64.exe.sha256
            artifacts/ShiftTracker-v*-win-x64.zip
            artifacts/ShiftTracker-v*-win-x64.zip.sha256
